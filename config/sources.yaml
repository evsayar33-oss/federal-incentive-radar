# Çalışma takvimi ve kaynak ayarları. Limitler değişirse yalnızca bu dosyayı güncelleyin.

schedule:
  timezone: "America/New_York"
  # Hedef saat (ET). İş akışı her iki yaz/kış saati için iki kez tetiklenir.
  # Kod yalnızca hedef saatten sonraki pencere içinde ve günde bir kez çalışır.
  slots:
    open:   {target: "09:45", window_minutes: 150}
    midday: {target: "12:30", window_minutes: 150}
    close:  {target: "16:15", window_minutes: 180}
  first_run_lookback_days: 30
  overlap_days: 1

sector_etfs:
  "Information Technology": XLK
  "Energy": XLE
  "Industrials": XLI
  "Materials": XLB
  "Utilities": XLU
  "Health Care": XLV
  "Financials": XLF
  "Consumer Discretionary": XLY
  "Consumer Staples": XLP
  "Communication Services": XLC
  "Real Estate": XLRE
benchmark: SPY

federal_register:
  enabled: true
  url: "https://www.federalregister.gov/api/v1/documents.json"
  doc_types: ["RULE", "PRORULE", "NOTICE", "PRESDOCU"]
  terms:
    - "grant program"
    - "tax credit"
    - "loan guarantee"
    - "funding opportunity"
    - "financial assistance"
    - "CHIPS"
    - "Inflation Reduction Act"
    - "Infrastructure Investment and Jobs Act"
    - "Defense Production Act"
    - "critical minerals"
  per_page: 100

congress:
  enabled: true
  url: "https://api.congress.gov/v3/bill"
  limit: 250
  max_pages: 4

usaspending:
  enabled: true
  url: "https://api.usaspending.gov/api/v2/search/spending_by_award/"
  min_award_usd: 10000000      # 10 milyon $ altı ödüller gürültü kabul edilir
  grant_codes: ["02", "03", "04", "05"]
  loan_codes: ["07", "08"]
  contracts_enabled: true
  contract_codes: ["A", "B", "C", "D"]   # tanımlı teslim, satın alma siparişi, sözleşme, teslimat siparişi
  contract_min_usd: 50000000             # 50 milyon $ ve üstü sözleşmeler
  max_pages: 3
  timeout_seconds: 100         # yavaş API için okuma süresi

grants_gov:
  enabled: true
  search_url: "https://api.grants.gov/v1/api/search2"
  fetch_url: "https://api.grants.gov/v1/api/fetchOpportunity"
  keywords:
    - "semiconductor"
    - "clean energy"
    - "hydrogen"
    - "grid"
    - "battery"
    - "critical minerals"
    - "broadband"
    - "infrastructure"
    - "manufacturing"
    - "nuclear"
  rows: 50
  max_detail_fetch: 25

sec_edgar:
  enabled: true
  url: "https://efts.sec.gov/LATEST/search-index"
  forms: "8-K,10-Q,10-K"
  # İfade → program eşlemesi (null = metinden/ajanstan tahmin et)
  phrases:
    '"CHIPS Act"': semiconductors
    '"CHIPS Incentives"': semiconductors
    '"Inflation Reduction Act"': clean_power
    '"Section 45X"': clean_manufacturing
    '"advanced manufacturing production credit"': clean_manufacturing
    '"Loan Programs Office"': null
    '"Defense Production Act"': critical_minerals
    '"Department of Energy" grant': null
    '"transferable tax credits"': clean_power
    '"Infrastructure Investment and Jobs Act"': infrastructure
    '"Section 45V"': hydrogen
    '"Section 45Q"': carbon_management
  max_hits_per_phrase: 100
  tickers_url: "https://www.sec.gov/files/company_tickers.json"

treasury_dts:
  enabled: true
  url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/dts/deposits_withdrawals_operating_cash"
  history_days: 200

fred:
  enabled: true
  # API anahtarı gerekmez: FRED grafik CSV uç noktası
  csv_url: "https://fred.stlouisfed.org/graph/fredgraph.csv"
  series: ["EPUFISCAL", "EPUTAXES", "EPUGOVTSPEND", "USEPUINDXD", "DGS10", "BAMLH0A0HYM2"]

gdelt:
  enabled: true
  url: "https://api.gdeltproject.org/api/v2/doc/doc"
  queries:
    - '"CHIPS Act" (grant OR award OR incentive)'
    - '("tax credit" OR "loan guarantee") ("Department of Energy" OR Treasury)'
    - '"Inflation Reduction Act" (repeal OR credit OR guidance)'
    - '"Defense Production Act" (award OR minerals)'
    - '("federal grant" OR "federal funding") (manufacturing OR plant OR factory)'
  max_records: 75
  timespan: "1d"

etf_holdings:
  enabled: true
  spdr_url: "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-{ticker}.xlsx"
  ishares:
    IVV: "https://www.ishares.com/us/products/239726/ishares-core-sp-500-etf/1467271812596.ajax?fileType=csv&fileName=IVV_holdings&dataType=fund"
    IWM: "https://www.ishares.com/us/products/239710/ishares-russell-2000-etf/1467271812596.ajax?fileType=csv&fileName=IWM_holdings&dataType=fund"

# Büyük şirket yatırımları (ayrı bölüm): başlıkta tutar + şirket + hisse eşleşmesi aranır.
# Bir kategori yalnızca "gate" içindeki TÜM koşulları geçerse "kanıtlandı" olur (uzun vade: 60 işlem günü).
corp_invest:
  enabled: true
  min_usd: 1000000000          # 1 milyar $ ve üstü
  signal_days: 30
  min_price: 5                 # olay gününde fiyatı bunun altındaki hisseler ölçülmez (likidite/spread)
  notify_statuses: ["proven"]
  queries:
    - '"announces" "billion" investment plant OR factory OR facility'
    - '"to invest" "billion" manufacturing'
    - '"billion" "data center" invest OR build'
    - '"billion" semiconductor fab invest'
    - '"billion" investment expansion U.S. announces'
    - '"to invest" "billion" AI infrastructure OR "cloud" OR "AI"'
    - '"billion" battery OR EV OR "electric vehicle" plant invest'
    - '"billion" "power plant" OR "nuclear" OR "solar" OR "grid" invest'
    - '"billion" pharmaceutical OR biotech manufacturing invest'
    - '"billion" "research and development" OR "R&D" invest'
    - '"billion" steel OR aluminum OR chemicals OR "critical minerals" invest'
    - '"commits" "billion" expansion OR "new facility" OR campus'
    - '"billion" "headquarters" OR "distribution center" OR "warehouse" invest'
    - '"unveils" OR "plans" "billion" investment'
    - '"billion" aerospace OR defense OR shipbuilding invest'
  subgroups:                   # keşif katmanı: büyüklük, göreli tutar, kısa ufuk, düşüş yönü
    large_weight: 0.30         # S&P 500 ağırlığı (%) bunun üstündeyse "büyük şirket"
    index_cap_usd: 50000000000000     # ağırlıktan yaklaşık piyasa değeri için S&P 500 toplam değeri (kaba)
    rel_big: 0.02              # tutar / piyasa değeri bu orandan büyükse "göreli büyük"
    cost_bps: 20               # gidiş-dönüş işlem maliyeti (baz puan), getiriden düşülür
    confirm_n: 12              # aday, keşiften sonraki en az bu kadar yeni olayda tekrar etmeli
  gate:
    min_gap_days: 30           # aynı hissede üst üste binen 60 günlük pencereleri azaltır
    clip_car: 0.5
    min_n_proven: 25
    hit_proven: 0.60           # haberlerin en az %60'ında 60 gün sonra piyasaya göre pozitif
    min_mean_proven: 0.02      # ortalama anormal getiri en az +%2
    q_proven: 0.10
    oos_min_n: 8
    oos_hit: 0.55              # zaman sırasıyla ikinci yarıda da tutmalı
    min_n_promising: 12
    hit_promising: 0.55
    min_mean_promising: 0.01
    p_promising: 0.10
    q_promising: 0.25
    null_min_n: 30
    null_p: 0.5

insider:                       # SEC Form 4 açık piyasa alımları (üç aylık veri setleri); kapılar corp_invest.gate ile aynı
  enabled: true
  entry_lag: 2                 # bildirim saati bilinmiyor: ertesi işlem günü kapanışında girilir (konservatif)
  min_tx_usd: 10000            # tek işlemde en az bu tutar (gürültüyü eler)
  min_total_usd: 250000        # küme / CEO-CFO alımı toplamı
  cluster_days: 10
  cluster_min_insiders: 3

prices:
  enabled: true
  history_period: "6y"       # kanıt motoru her olay için 250 gün öncesine bakar; 5 yıllık olay için 6+ yıl gerekir
  max_extra_tickers: 150
  warn_missing_share: 0.4    # bulunamayan sembol oranı bunu aşarsa uyarı (altında yalnızca INFO)
  max_event_tickers: 1500    # kanıt motoru: olayı olan şirketlerin fiyatları (geçmiş veri için geniş)

alerts:
  min_award_usd: 100000000
  sector_score_jump: 8
  create_github_issue: true

# Telegram botu. Gizli anahtarlar: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (GitHub Secrets).
telegram:
  enabled: true
  # Hangi kanıt düzeyi bildirilsin? proven = yalnızca kanıtlanmış (önerilen).
  # Daha fazla bildirim isterseniz: ["proven", "promising"]
  notify_statuses: ["proven"]
  min_abs_effect: 0.0        # ör. 0.01 = yalnızca beklenen etkisi %1'in üstünde olanlar
  max_event_age_days: 3      # eski olaylar (geri doldurma) bildirilmez
  max_per_run: 8             # fazlası tek özet mesajda gelir
  weekly_summary: true       # cumartesi kanıt raporu ve bot karnesi
  health_messages: true      # ayrı sistem sağlığı mesajı
  health_ok_slots: ["close", "weekly"]   # sorun yoksa yalnız bu çalışmalarda
  health_repeat_hours: 24    # aynı sorun imzası bu süre içinde tekrar mesaj üretmez (yeni/farklı sorun hemen gelir)
  persistent_runs: 3         # bir kaynak üst üste bu kadar çalışmada yedekte/başarısızsa "kalıcı sorun" sayılır

# Veri kalitesi eşikleri
quality:
  review_queue_warn: 50        # bu sayıdan fazla çözülmemiş belirsiz eşleşme → uyarı
  auto_none_below_score: 90    # bundan düşük benzerlikli ve ilk kelimesi uyuşmayan adaylar otomatik "şirket yok"
  stale_price_days: 5          # fiyat verisi bu kadar günden eskiyse uyarı

