name: Haftalık öğrenme

# Cumartesi: evren (ETF varlıkları + SEC ticker), 3 yıllık fiyat, tahmin puanlama,
# kalibrasyon, olay çalışması, sınıflandırıcı yeniden eğitimi, drift kontrolü.
on:
  schedule:
    - cron: "23 9 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src
      RADAR_STORE: store
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_LABEL: weekly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-etl.txt
      - run: pip install -r requirements-etl.txt
      - run: bash .github/scripts/data_branch.sh setup
      - run: python -m radar.run weekly
      - if: always()
        run: bash .github/scripts/data_branch.sh publish
