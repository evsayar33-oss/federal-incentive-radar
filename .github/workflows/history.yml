name: Geçmiş veri (backtest)

# Kanıt tablosunu geçmiş olaylarla doldurur. Elle çalıştırılır. Süre bütçesi dolarsa durur;
# tekrar çalıştırınca kaldığı yerden devam eder. Bitince Telegram'a sağlık mesajı gider.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Kaç yıl geriye?"
        default: "5"

permissions:
  contents: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      PYTHONPATH: src
      RADAR_STORE: store
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_LABEL: history
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-etl.txt
      - run: pip install -r requirements-etl.txt
      - run: bash .github/scripts/data_branch.sh setup
      - run: python -m radar.run history --years "${{ github.event.inputs.years || '5' }}" --budget 120
      - if: always()
        run: bash .github/scripts/data_branch.sh publish
