name: Independent Alpha Discovery — pre-registered research

# No scheduled autonomous data mutations. Does not run or alter H083.
on:
  pull_request:
    paths:
      - "src/radar/alpha_discovery.py"
      - "tests/test_alpha_discovery.py"
      - ".github/workflows/alpha_discovery.yml"
  workflow_dispatch:
  schedule:
    - cron: '40 5 * * 6'  # Saturday 05:40 UTC; after Friday US close

permissions:
  contents: read

concurrency:
  group: alpha-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-etl.txt
      - name: Install pinned project research dependencies
        run: python -m pip install -r requirements-etl.txt pytest
      - name: Test no-lookahead and research-only constraints
        run: PYTHONPATH=src pytest -q tests/test_alpha_discovery.py
      - name: Read published data snapshot without updating data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin refs/heads/data:refs/remotes/origin/data
          mkdir -p /tmp/radar-alpha-input
          git show refs/remotes/origin/data:prices.parquet > /tmp/radar-alpha-input/prices.parquet
          git show refs/remotes/origin/data:event_trade_feed.csv > /tmp/radar-alpha-input/event_trade_feed.csv
          if git cat-file -e refs/remotes/origin/data:economic_relationships.parquet 2>/dev/null; then
            git show refs/remotes/origin/data:economic_relationships.parquet > /tmp/radar-alpha-input/economic_relationships.parquet
          fi
          echo "INPUT_SNAPSHOT_SHA=$(git rev-parse refs/remotes/origin/data)" >> "$GITHUB_ENV"
      - name: Execute 5 fixed hypotheses against historical observations
        env:
          PYTHONPATH: src
        run: |
          python -m radar.alpha_discovery \
            --prices /tmp/radar-alpha-input/prices.parquet \
            --feed /tmp/radar-alpha-input/event_trade_feed.csv \
            --relationships /tmp/radar-alpha-input/economic_relationships.parquet \
            --output alpha_discovery_results
          printf 'DATA_SNAPSHOT_SHA=%s\n' "$INPUT_SNAPSHOT_SHA" | tee alpha_discovery_results/data_snapshot.txt
      - name: Export reproducible, isolated research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-discovery-pre-registered-research
          path: alpha_discovery_results/
          retention-days: 30
          if-no-files-found: warn
